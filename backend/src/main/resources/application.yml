spring:
  datasource:
    url: jdbc:h2:mem:srm_credit_engine;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
  flyway:
    enabled: true
  sql:
    init:
      mode: never

management:
  endpoint:
    health:
      probes:
        enabled: true

# H2 is an interim local test Adapter authorized by the user. PostgreSQL,
# Testcontainers, Docker Compose, query plans, and lock semantics remain deferred.
