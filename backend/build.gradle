plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.jk1.dependency-license-report' version '3.1.4'
    id 'jacoco'
}

group = 'com.srm'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext['junit-jupiter.version'] = '5.14.2'

repositories {
    mavenCentral()
}

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

    runtimeOnly 'org.postgresql:postgresql:42.7.12'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    integrationTestImplementation platform('io.cucumber:cucumber-bom:7.34.3')
    integrationTestImplementation platform('org.junit:junit-bom:5.14.2')
    integrationTestImplementation 'io.cucumber:cucumber-java'
    integrationTestImplementation 'io.cucumber:cucumber-spring'
    integrationTestImplementation 'io.cucumber:cucumber-junit-platform-engine'
    integrationTestImplementation 'org.junit.platform:junit-platform-suite'
    integrationTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
    integrationTestImplementation 'org.testcontainers:junit-jupiter'
    integrationTestImplementation 'org.testcontainers:postgresql'
    integrationTestRuntimeOnly 'io.micrometer:micrometer-registry-prometheus'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    dependsOn tasks.named('integrationTest')
    executionData.from(
        layout.buildDirectory.file('jacoco/test.exec'),
        layout.buildDirectory.file('jacoco/integrationTest.exec')
    )
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs PostgreSQL Testcontainers integration contracts.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'cucumber.junit-platform.naming-strategy', 'long'
    // When with-java21.sh has routed Docker traffic through Colima, lift docker-java's
    // shaded API version past the Colima daemon minimum of 1.40
    if ((System.getenv('DOCKER_HOST') ?: '').contains('.colima')) {
        systemProperty 'api.version', '1.41'
    }
    shouldRunAfter tasks.named('test')
}
def riskCoverageIncludes = [
        // Financial APIs are risk-bearing: they own wire bounds, response rounding,
        // status codes, idempotency headers, and generated OpenAPI schema names.
        'com/srm/creditengine/assignor/api/**',
        'com/srm/creditengine/assignor/domain/**',
        'com/srm/creditengine/assignor/application/**',
        'com/srm/creditengine/assignor/infrastructure/**',
        'com/srm/creditengine/receivable/api/**',
        'com/srm/creditengine/receivable/domain/**',
        'com/srm/creditengine/receivable/application/**',
        'com/srm/creditengine/receivable/infrastructure/**',
        'com/srm/creditengine/currency/**',
        'com/srm/creditengine/pricing/**',
        'com/srm/creditengine/settlement/api/**',
        'com/srm/creditengine/settlement/domain/**',
        'com/srm/creditengine/settlement/application/**',
        'com/srm/creditengine/settlement/infrastructure/**',
        'com/srm/creditengine/reporting/api/**',
        'com/srm/creditengine/reporting/application/**',
        'com/srm/creditengine/audit/api/**',
        'com/srm/creditengine/audit/application/**',
        'com/srm/creditengine/audit/infrastructure/**',
        'com/srm/creditengine/identity/application/**',
        'com/srm/creditengine/identity/domain/**',
        'com/srm/creditengine/identity/api/**',
        'com/srm/creditengine/identity/infrastructure/**',
        'com/srm/creditengine/shared/api/**'
]
def riskCoverageExcludes = [
        'com/srm/creditengine/identity/infrastructure/DevelopmentOperatorSeeder.class'
]
def riskClassDirectories = sourceSets.main.output.classesDirs.asFileTree.matching {
    include riskCoverageIncludes
    exclude riskCoverageExcludes
}

tasks.register('riskCoverage', org.gradle.testing.jacoco.tasks.JacocoCoverageVerification) {
    group = 'verification'
    description = 'Verifies 95% line, branch, and method coverage for financial and security risk code.'
    dependsOn tasks.named('jacocoTestReport')
    executionData.from(
        layout.buildDirectory.file('jacoco/test.exec'),
        layout.buildDirectory.file('jacoco/integrationTest.exec')
    )
    sourceDirectories.setFrom(sourceSets.main.allSource.srcDirs)
    classDirectories.setFrom(riskClassDirectories)
    violationRules {
        rule {
            element = 'BUNDLE'
            ['LINE', 'BRANCH', 'METHOD'].each { counterType ->
                limit {
                    counter = counterType
                    value = 'COVEREDRATIO'
                    minimum = 0.95
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('riskCoverage')
}

tasks.register('exportOpenApi', Test) {
    description = 'Exports the canonical runtime OpenAPI document as deterministic JSON.'
    group = 'documentation'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.srm.creditengine.api.OpenApiExportTest'
    }
    def openApiOutput = layout.buildDirectory.file('generated/openapi/srm-openapi.json')
    systemProperty 'srm.openapi.output', openApiOutput.get().asFile.absolutePath
    outputs.file(openApiOutput)
}


import com.github.jk1.license.filter.LicenseBundleNormalizer
import com.github.jk1.license.render.JsonReportRenderer

licenseReport {
    renderers = [new JsonReportRenderer('license-report.json')]
    filters = [new LicenseBundleNormalizer()]
    allowedLicensesFile = new File("$projectDir/config/allowed-licenses.json")
}
